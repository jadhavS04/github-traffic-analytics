name: Collect GitHub traffic

on:
  schedule:
    - cron: "15 0 * * *"    # 00:15 UTC: finalises yesterday's numbers
    - cron: "15 12 * * *"   # 12:15 UTC: refreshes today's partial numbers
  workflow_dispatch:         # "Run workflow" button

concurrency:
  group: traffic-collector
  cancel-in-progress: false

permissions:
  contents: write            # lets the job commit data/ and docs/

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect traffic and repo stats
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GH_PAT }}
        run: python scripts/collect.py

      - name: Build dashboard data
        if: always()
        run: python scripts/build_dashboard.py

      - name: Commit results
        if: always()
        run: |
          git config user.name "traffic-bot"
          git config user.email "traffic-bot@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
